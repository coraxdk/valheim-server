name: Build and Push Docker Image from Master Branch

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/coraxdk
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/coraxdk/valheim-server:master
            ghcr.io/coraxdk/valheim-server:build-${{ github.run_number }}
            ghcr.io/coraxdk/valheim-server:sha-${{ github.sha }}