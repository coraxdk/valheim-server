name: Auto-Build Valheim Image

on:
  schedule:
    - cron: '0 * * * *' # Check every hour
  workflow_dispatch: # Allows manual override

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: coraxdk/valheim-server

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Fetch Latest Valheim Build ID from Steam
        id: steam
        run: |
          # Query SteamCMD API for Valheim Dedicated Server (AppID: 896660)
          JSON=$(curl -s "https://api.steamcmd.net/v1/info/896660")
          BUILD_ID=$(echo "$JSON" | jq -r '.data["896660"].depots.branches.public.buildid')
          
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" = "null" ]; then
            echo "Error: Could not fetch Build ID from Steam API"
            exit 1
          fi
          
          echo "Latest Steam Build ID: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT

      - name: Check if Image Tag Exists in GHCR
        id: registry-check
        run: |
          # Requesting for a public token
          TOKEN=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:coraxdk/valheim-server:pull" | jq -r .token)

          # Getting the tags list from GHCR for the image
          TAGS=$(curl -s -L -H "Authorization: Bearer $TOKEN" "https://ghcr.io/v2/coraxdk/valheim-server/tags/list")
          
          if echo "$TAGS" | jq -e --arg TAG "${{ steps.steam.outputs.build_id }}" '.tags | index(${{ steps.steam.outputs.build_id }})' >/dev/null; then
            echo "Tag ${{ steps.steam.outputs.build_id }} already exists. The image is up-to-date."
            echo "build_needed=false" >> $GITHUB_OUTPUT
          else
            echo "Tag ${{ steps.steam.outputs.build_id }} does not exist. A new build is needed."
            echo "build_needed=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.registry-check.outputs.build_needed == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.registry-check.outputs.build_needed == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io/coraxdk
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Docker Image to GHCR
        if: steps.registry-check.outputs.build_needed == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # GitHub registrerer tags bedst i små bogstaver, så vi tvinger formatet her
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.steam.outputs.build_id }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            VALHEIM_BUILD_ID=${{ steps.steam.outputs.build_id }}
          labels: |
            org.opencontainers.image.title=Valheim Dedicated Server
            org.opencontainers.image.version=${{ steps.steam.outputs.build_id }}
            org.opencontainers.image.revision=${{ github.sha }}
          no-cache: true